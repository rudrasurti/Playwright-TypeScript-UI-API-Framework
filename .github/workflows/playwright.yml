name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # every Monday 04:00 UTC

permissions:
  contents: read

concurrency:
  group: pw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests (${{ matrix.project }})
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        if: matrix.project != 'api'
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }} --reporter=blob,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results/junit.xml
      - name: QA Report Bot
        if: always()
        uses: rudrasurti/qa-report-bot@main
        with:
          junit-path: results/junit.xml
          title: Playwright (${{ matrix.project }})
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ matrix.project }}
          path: blob-report
          retention-days: 7

  report:
    name: Merge report and publish to GitHub Pages
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge reports into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report
      - id: deploy
        uses: actions/deploy-pages@v4
